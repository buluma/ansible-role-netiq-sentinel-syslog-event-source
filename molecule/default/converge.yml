---
- name: Converge
  hosts: all
  tasks:
    - name: Run role
      block:
        - name: Include role
          ansible.builtin.include_role:
            name: buluma.netiq_sentinel_syslog_event_source
        # Handler failures are NOT caught by rescue unless flushed inside
        # the block: they normally run at end-of-play, outside this scope.
        - name: Flush handlers
          ansible.builtin.meta: flush_handlers
      rescue:
        # TEMPORARY: diagnosing "Unable to start service rsyslog: ... control
        # process exited with error code" on almalinux10/rockylinux10 only.
        - name: DEBUG | rsyslog service status
          ansible.builtin.command: systemctl status rsyslog --no-pager -l
          register: __debug_rsyslog_status
          changed_when: false
          failed_when: false
        - name: DEBUG | print rsyslog service status
          ansible.builtin.debug:
            var: __debug_rsyslog_status.stdout_lines
        - name: DEBUG | rsyslog journal
          ansible.builtin.command: journalctl -u rsyslog --no-pager -n 200
          register: __debug_rsyslog_journal
          changed_when: false
          failed_when: false
        - name: DEBUG | print rsyslog journal
          ansible.builtin.debug:
            var: __debug_rsyslog_journal.stdout_lines
        # rsyslog.service sets StandardOutput=null, which swallows rsyslogd's
        # own parse-error text before it reaches the journal. Run it
        # directly to see the real error.
        - name: DEBUG | rsyslogd config check
          ansible.builtin.command: rsyslogd -N1 -f /etc/rsyslog.conf
          register: __debug_rsyslogd_n1
          changed_when: false
          failed_when: false
        - name: DEBUG | print rsyslogd config check
          ansible.builtin.debug:
            msg: "rc={{ __debug_rsyslogd_n1.rc }} stdout={{ __debug_rsyslogd_n1.stdout_lines }} stderr={{ __debug_rsyslogd_n1.stderr_lines }}"
        - name: Re-raise original failure
          ansible.builtin.fail:
            msg: "Role failed - see DEBUG output above for rsyslog status/journal."
