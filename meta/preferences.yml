---
# Pins the CI platform/version matrix for this role. Without this, ansible-generator
# falls back to default_platforms and silently discards these choices on regenerate.
platforms:
  - name: EL
    versions:
      # Excludes 10: rsyslog 8.2510's capng_apply() capability-drop at
      # startup fails under EL10's rsyslog.service (NoNewPrivileges=yes)
      # inside containers -- "could not transfer the specified internal
      # posix capabilities settings to the kernel, capng_apply=-4"
      # (rsyslog.com/e/2455). OS packaging issue, not fixable from here.
      - "9"
  - name: Debian
    versions:
      - all
  - name: Fedora
    versions:
      # Excludes 45: it ships Python 3.15.0b3, whose dataclasses module
      # dropped _is_type, breaking ansible-core's AnsiballZ module wrapper.
      - "44"
      - "43"
  - name: Ubuntu
    versions:
      - all
